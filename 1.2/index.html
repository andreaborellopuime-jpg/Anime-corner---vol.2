<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime corner - Recomendaciones</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e50914" />
  <meta name="mobile-web-app-capable" content="yes">

   <!-- CDN de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="header">
    <div class="logo">🌪️|Anime corner</div>
    <nav class="nav">
      <a href="#formulario">Recomendar</a>
      <a href="#catalogo">Catálogo</a>
    </nav>
  </header>

  <main class="container">
    
    <!-- SECCIÓN FORMULARIO (CLASE 1) -->
    <section id="formulario" class="card-form">
      <h2>Recomendá una Serie</h2>
      <p class="subtitle">Compartí con la comunidad tus animes favoritos</p>

      <form id="form-serie">
        <div class="form-group">
          <label for="titulo">Título del anime</label>
          <input type="text" id="titulo" placeholder="Ej: Tokyo Ghoul" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="genero">Género</label>
            <select id="genero" required>
              <option value="" disabled selected>Seleccioná...</option>
              <option value="Ciencia Ficción">Ciencia Ficción</option>
              <option value="Drama">Drama</option>
              <option value="Romance">Romance</option>
              <option value="Comedia">Comedia</option>
              <option value="Acción">Acción</option>
              <option value="Terror">Terror</option>
              <option value="Shonen">Shonen</option>
              <option value="Shojo">Shojo</option>
            </select>
          </div>

          <div class="form-group">
            <label for="puntuacion">Puntuación (1 al 10)</label>
            <input type="number" id="puntuacion" min="1" max="10" step="0.5" value="8" required>
          </div>
        </div>

        <div class="form-group">
            <label for="image-file">Portada del anime:</label>
            <input type="file" id="image-file" accept="image/*" class="form-control">
        </div>

        <div class="form-group">
          <label for="resena">¿Por qué lo recomendás? (Reseña breve)</label>
          <textarea id="resena" rows="3" placeholder="Contanos qué es lo que más te gustó..." required></textarea>
        </div>

        <button type="submit" class="btn-primary">Publicar Recomendación</button>
      </form>
    </section>

    <!-- SECCIÓN VISTA PREVIA / CATÁLOGO (PARA LAS PRÓXIMAS CLASES) -->
    <section id="catalogo" class="catalog-section">
      <h2>Catálogo de la Comunidad</h2>
      <div id="contenedor-cards" class="grid-cards">
        <!-- Acá JavaScript renderizará las cards dinámicamente desde Supabase -->
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>Proyecto Demo - Escuela Técnica N° 2 | Desarrollo Web</p>
  </footer>

    <!-- Carga de scripts en orden -->
  <script src="supabaseClient.js"></script>
  <script src="main2.js"></script>
</body>
</html>
